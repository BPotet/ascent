# Barrière « Coverage et qualité » (docs/workflow.md) : SonarQube Cloud.
# Le job CI « sonar » est sauté tant que le secret SONAR_TOKEN n'est pas configuré (voir docs/adr/0001-socle-technique.md).
sonar.projectKey=BPotet_ascent
sonar.organization=bpotet
sonar.projectName=Ascent

sonar.sources=src
sonar.tests=src,test,features
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/testing/**,test/**,features/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/testing/**
# Les données recopiées de l'Atelier (atelier/data) ne sont pas mesurées en duplication (ADR 0010), ni
# le contenu recopié du Codex (format/codex : pages des ennemis, ADR 0032, D11 ; descriptions des
# objets, ADR 0031) ; leur couverture reste mesurée.
sonar.cpd.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/adapters/ui/pixelArt/sprites/atelier/data/**,src/adapters/ui/format/codex/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
