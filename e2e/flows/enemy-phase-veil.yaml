# Story #188 : le voile de phase ennemie et la Frise d'action assombrie (captures des écrans).
# La planche des icônes (ascent://preview/icon-board) ouvre le vrai écran de l'ascension sur des
# combats fixes, chacun dans une session en mémoire, jamais celle du joueur. Chaque combat est repris
# à la préparation d'un coup imparable : après « Reprise dans », la préparation repart du début, sous
# le voile. La capture suit le sceau rouge (`peril-seal`). Le héros ne se défend pas : le
# combat continue jusqu'à la phase du héros, qui attend son attaque (décision du 25/10 : le gameplay
# du combat se teste à la main sur l'APK).
# Captures à comparer à la maquette v2 `docs/mockups/174-tier-identity/` : C1 (palier 1, le Spectre),
# C3 (palier 3, le Veilleur d'airain) et le retour en phase du héros. La largeur et la densité sont
# celles de l'émulateur de la CI.
appId: com.bpotet.ascent
name: Le voile de phase ennemie
tags:
  - story-188
---
- runFlow: ../subflows/launch-fresh.yaml
- openLink: ascent://preview/icon-board
- extendedWaitUntil:
    visible: 'Planche des icônes'
    timeout: 15000

# C1 : les Catacombes, le Spectre prépare un coup imparable ; la scène et la frise assombries.
- scrollUntilVisible:
    element:
      text: 'Voile · coup imparable · palier 1'
    direction: DOWN
- tapOn: 'Voile · coup imparable · palier 1'
- extendedWaitUntil:
    visible: 'Reprise dans.*'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Reprise dans.*'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'peril-seal'
    timeout: 10000
- takeScreenshot: veil-c1-enemy-phase-perilous
# Le retour en phase du héros : le voile levé, l'aperçu de la frise comme avant #188.
- extendedWaitUntil:
    visible:
      id: 'battle-zone-line'
      text: 'Cible.*'
    timeout: 30000
- takeScreenshot: veil-hero-phase-back
- tapOn:
    id: 'ascent-pause'
- extendedWaitUntil:
    visible: 'Planche des icônes'
    timeout: 15000

# C3 : le Beffroi, le Veilleur d'airain prépare Glas, le dernier de la manche.
- scrollUntilVisible:
    element:
      text: 'Voile · coup imparable · palier 3'
    direction: DOWN
- tapOn: 'Voile · coup imparable · palier 3'
- extendedWaitUntil:
    visible: 'Reprise dans.*'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Reprise dans.*'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'peril-seal'
    timeout: 10000
- takeScreenshot: veil-c3-enemy-phase-perilous
