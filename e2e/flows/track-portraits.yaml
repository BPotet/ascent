# Story #175 : les portraits dans la Frise d'action (chemin B, captures des écrans).
# La planche des icônes (ascent://preview/icon-board) ouvre le vrai écran de l'ascension sur des
# combats fixes, chacun dans une session en mémoire, jamais celle du joueur. L'héroïne agit la
# première et attend son attaque : la frise reste fixe pendant la capture. Aucun combat n'est joué
# (décision du 25/10 : le gameplay du combat se teste à la main sur l'APK).
# Captures à comparer à la maquette v2 `docs/mockups/174-tier-identity/` : F1 (manche et aperçu), F2
# (deux Goules, frise pleine de 4 + 4 cases) et F4 (boss en phase 2, combat repris). La largeur et la
# densité sont celles de l'émulateur de la CI.
appId: com.bpotet.ascent
name: Les portraits de la Frise d'action
tags:
  - story-175
---
- runFlow: ../subflows/launch-fresh.yaml
- openLink: ascent://preview/icon-board
- extendedWaitUntil:
    visible: 'Planche des icônes'
    timeout: 15000

# F1 : l'Errante agit (48 dp), puis le Squelette et la Goule, « suiv. » et l'aperçu.
- scrollUntilVisible:
    element:
      text: 'Frise · manche et aperçu'
    direction: DOWN
- tapOn: 'Frise · manche et aperçu'
- extendedWaitUntil:
    visible:
      id: 'battle-pad'
    timeout: 15000
- assertVisible:
    id: 'battle-action-track'
    text: "Ordre d'action. Manche 1 : toi, Squelette, Goule. Manche suivante : toi, Squelette, Goule."
- takeScreenshot: track-f1-round-and-preview
- tapOn:
    id: 'ascent-pause'
- extendedWaitUntil:
    visible: 'Planche des icônes'
    timeout: 15000

# F2 : deux Goules, le même portrait sans pastille ; la frise pleine, 4 + 4 cases, sur une ligne.
- scrollUntilVisible:
    element:
      text: 'Frise · deux Goules'
    direction: DOWN
- tapOn: 'Frise · deux Goules'
- extendedWaitUntil:
    visible:
      id: 'battle-pad'
    timeout: 15000
- assertVisible:
    id: 'battle-action-track'
    text: "Ordre d'action. Manche 1 : toi, Squelette, Goule, Goule. Manche suivante : toi, Squelette, Goule, Goule."
- takeScreenshot: track-f2-two-ghouls-full
- tapOn:
    id: 'ascent-pause'
- extendedWaitUntil:
    visible: 'Planche des icônes'
    timeout: 15000

# F4 : la Jardinière des cendres déjà en phase 2, combat repris : son portrait de phase 2 dans la
# manche et dans l'aperçu.
- scrollUntilVisible:
    element:
      text: 'Frise · boss en phase 2'
    direction: DOWN
- tapOn: 'Frise · boss en phase 2'
- extendedWaitUntil:
    visible: 'Reprise dans.*'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Reprise dans.*'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'battle-pad'
    timeout: 15000
- assertVisible:
    id: 'battle-action-track'
    text: "Ordre d'action. Manche 1 : toi, Jardinière des cendres. Manche suivante : Jardinière des cendres, toi."
- takeScreenshot: track-f4-boss-phase-two
