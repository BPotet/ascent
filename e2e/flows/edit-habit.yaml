# Story #6 : renommer et supprimer une habitude.
# Parcours : créer « Cuisiner » → la cocher (10 XP) → « ⋯ » : panneau « Modifier l'habitude » →
# la renommer « Cuisiner le soir » → le nouveau nom s'affiche, toujours « fait » → « ⋯ » →
# « Supprimer l'habitude » : la fenêtre annonce le retrait de 10 XP → « Supprimer » : état vide,
# 0 XP.
# Prime d'objectif (#26) : créée aujourd'hui, l'habitude a l'objectif 7 réduit aux jours restants,
# 1 le dimanche : la cocher atteint alors l'objectif (+5 XP de prime). Les expériences exactes
# passent par `subflows/expect-xp.yaml` (10 XP, ou 15 XP), et la fenêtre de suppression annonce
# aussi la prime qui tombe.
# Sélecteurs : un `testID` posé sur un `Modal` n'est pas garanti sur la vue native Android ; le
# panneau est repéré par son contenu (`edit-habit-sheet-content`), la fenêtre de suppression
# (`delete-habit-dialog`) par son titre et son bouton `confirm-delete-habit`.
# Captures pour la comparaison avec la maquette (E7, E8) : panneau « Modifier l'habitude »,
# renommée, fenêtre de suppression, état vide après la suppression.
appId: com.bpotet.ascent
name: Renommer et supprimer une habitude
tags:
  - story-6
---
- runFlow: ../subflows/launch-fresh.yaml

# Une habitude créée aujourd'hui, cochée.
- tapOn:
    id: 'add-habit'
- extendedWaitUntil:
    visible: 'Nouvelle habitude'
    timeout: 10000
- tapOn:
    id: 'new-habit-name'
- inputText: 'Cuisiner'
- tapOn:
    id: 'create-habit'
- extendedWaitUntil:
    notVisible: 'Nouvelle habitude'
    timeout: 10000
- extendedWaitUntil:
    visible: 'Cuisiner, .+, à faire, .+ cette semaine, Moyenne, 10 XP par suivi(, objectif atteint)?'
    timeout: 10000
- tapOn: 'Cuisiner, .+, à faire, .+ cette semaine, Moyenne, 10 XP par suivi(, objectif atteint)?'
- runFlow:
    file: ../subflows/expect-xp.yaml
    env:
      ROW: 'Cuisiner, .+, fait, .+ cette semaine, Moyenne, 10 XP par suivi'
      XP: '10 XP'
      XP_IF_TARGET_REACHED: '15 XP'

# « ⋯ » ouvre « Modifier l'habitude », sans clavier : « Supprimer l'habitude » reste visible.
- tapOn: 'Modifier l’habitude Cuisiner'
- extendedWaitUntil:
    visible:
      id: 'edit-habit-sheet-content'
    timeout: 10000
- assertVisible:
    id: 'edit-habit-name'
- assertVisible:
    id: 'delete-habit'
- takeScreenshot: edit-habit-1-sheet

# Renommer : le nouveau nom s'affiche, la case reste « fait », l'expérience ne change pas.
- tapOn:
    id: 'edit-habit-name'
- eraseText: 20
- inputText: 'Cuisiner le soir'
- hideKeyboard
- tapOn:
    id: 'save-habit'
- extendedWaitUntil:
    notVisible:
      id: 'edit-habit-sheet-content'
    timeout: 10000
- runFlow:
    file: ../subflows/expect-xp.yaml
    env:
      ROW: 'Cuisiner le soir, .+, fait, .+ cette semaine, Moyenne, 10 XP par suivi'
      XP: '10 XP'
      XP_IF_TARGET_REACHED: '15 XP'
- takeScreenshot: edit-habit-2-renamed

# Supprimer : la fenêtre nomme l'habitude et annonce le retrait de 10 XP, et aussi celui de la
# prime de la semaine (−5 XP, −15 XP en tout) quand l'objectif est atteint (#26). La branche est
# choisie sur le libellé de la ligne, lu avant d'ouvrir la fenêtre (qui le cache ensuite) : il est
# gardé dans `output.targetReached`.
- evalScript: ${output.targetReached = false}
- runFlow:
    when:
      visible: 'Cuisiner le soir, .+, fait, .+ cette semaine, Moyenne, 10 XP par suivi, objectif atteint'
    commands:
      - evalScript: ${output.targetReached = true}
- runFlow:
    when:
      true: ${output.targetReached}
    commands:
      - tapOn: 'Modifier l’habitude Cuisiner le soir'
      - extendedWaitUntil:
          visible:
            id: 'edit-habit-sheet-content'
          timeout: 10000
      - tapOn:
          id: 'delete-habit'
      - extendedWaitUntil:
          visible: 'Supprimer «.Cuisiner le soir.».\?'
          timeout: 10000
      - assertVisible: '.*\(−10 XP\) et la prime de cette semaine \(−5 XP\), l.objectif n.étant plus atteint.: −15 XP en tout\.'
- runFlow:
    when:
      true: ${!output.targetReached}
    commands:
      - tapOn: 'Modifier l’habitude Cuisiner le soir'
      - extendedWaitUntil:
          visible:
            id: 'edit-habit-sheet-content'
          timeout: 10000
      - tapOn:
          id: 'delete-habit'
      - extendedWaitUntil:
          visible: 'Supprimer «.Cuisiner le soir.».\?'
          timeout: 10000
      - assertVisible: '.*\(−10 XP\)\.'
- assertVisible:
    id: 'confirm-delete-habit'
- assertVisible: 'Annuler'
- takeScreenshot: edit-habit-3-delete-dialog

# Confirmée : l'état vide revient, l'expérience d'aujourd'hui est retirée.
- tapOn:
    id: 'confirm-delete-habit'
- extendedWaitUntil:
    visible:
      id: 'day-view-empty'
    timeout: 10000
- assertNotVisible: 'Cuisiner le soir, .+'
- extendedWaitUntil:
    visible:
      id: 'xp-counter'
      text: '0 XP'
    timeout: 10000
- takeScreenshot: edit-habit-4-empty-after-delete
