# Parcours de démarrage : l'app s'ouvre hors ligne, crée sa base locale et affiche l'accueil,
# la Vue Journée (vide sur une installation neuve).
appId: com.bpotet.ascent
name: Lancement de l'application
tags:
  - smoke
---
- runFlow: ../subflows/launch-fresh.yaml
- assertVisible: 'Ajouter une habitude'
- takeScreenshot: launch-day-view-empty
# Relance à froid : la base locale déjà migrée est rouverte.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'day-view-empty'
    timeout: 60000
