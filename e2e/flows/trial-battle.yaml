# Stories #31 et #32 (combat complet, partie A) : test de fumée du combat d'essai, ouvert depuis
# son point d'entrée provisoire (build de preview).
# Décision du propriétaire du 25/10 : le gameplay du combat (timing, parade, frappe, transitions)
# se teste à la main sur l'APK ; l'e2e vérifie seulement que le combat s'ouvre et s'affiche ; les
# règles sont couvertes par les tests unitaires, d'intégration et BDD.
# Parcours : installation neuve → « Combat d'essai » → bulle d'aide F2 (capture), fermée → phase du
# héros (F1, capture) : « Attaquer », « Pouvoir », les trois ennemis avec leur garde et leur
# intention, la barre du héros et son Élan → un toucher sur « Attaquer ».
# Aucune attente ne dépend du timing du combat : la phase du héros dure jusqu'au toucher, et rien
# n'est vérifié après lui. Les réglages d'essai et le panneau Mesures ne s'ouvrent qu'à la fin d'un
# combat : ils sont vérifiés par les tests d'intégration, pas ici.
appId: com.bpotet.ascent
name: Combat d'essai du build de preview
tags:
  - story-31
  - story-32
---
- runFlow: ../subflows/launch-fresh.yaml

- tapOn: "Combat d'essai"
- extendedWaitUntil:
    visible:
      id: 'battle-attack-button'
    timeout: 15000

# F2 : la bulle d'aide de la première phase du héros, fermée si elle est là.
- runFlow:
    when:
      visible:
        id: 'battle-hint-hero'
    commands:
      - takeScreenshot: trial-battle-f2-first-use
      - tapOn:
          id: 'battle-hint-hero'
- assertNotVisible:
    id: 'battle-hint-hero'

# F1 : la phase du héros, stable jusqu'au toucher. La Goule est présélectionnée ; chaque ennemi
# montre sa garde et la catégorie de son intention, jamais le type de coup ni les dégâts.
- assertVisible: 'Phase du héros|PHASE DU HÉROS'
- assertVisible:
    id: 'enemy-ghoul'
    text: 'Goule, cible, 50 PV sur 50, garde 15 sur 15, intention : attaque'
- assertVisible:
    id: 'enemy-specter'
    text: 'Spectre, 35 PV sur 35, garde 10 sur 10, intention : attaque'
- assertVisible:
    id: 'enemy-necromancer'
    text: 'Nécromancien, 45 PV sur 45, garde 12 sur 12, intention : .*'
- assertVisible:
    id: 'battle-hero-bar'
    text: 'La Sentinelle, PV 80 sur 80, Élan 1 sur 5'
- assertVisible:
    id: 'battle-power-button'
    text: 'Pouvoir : Rempart, 1 Élan'
- assertVisible:
    id: 'battle-attack-button'
    text: 'Attaquer, cible : Goule'
- takeScreenshot: trial-battle-f1-hero-phase

# Un toucher sur « Attaquer » : le combat continue, sans vérification après le toucher (tout ce
# qui suit dépend du timing du combat).
- tapOn:
    id: 'battle-attack-button'
