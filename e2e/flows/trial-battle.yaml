# Stories #31, #32, #81 (combat complet, parties A et B) et prototype #90 (Initiative, frise
# d'action et l'Errante) : test de fumée du combat d'essai, ouvert depuis son point d'entrée
# provisoire (build de preview), avec la scène en pixel art 2.5D.
# Décision du propriétaire du 25/10 : le gameplay du combat (timing, parade, frappe, transitions)
# se teste à la main sur l'APK ; l'e2e vérifie seulement que le combat s'ouvre et s'affiche ; les
# règles sont couvertes par les tests unitaires, d'intégration et BDD.
# Parcours : installation neuve → « Combat d'essai » → choix du héros (H1, capture) → « Commencer
# le combat » → la scène, la frise d'action et la barre du héros (capture).
# Avec l'Initiative, le Spectre agit avant le héros : la phase en cours à l'ouverture dépend du
# timing du combat. Seuls des éléments présents dans toutes les phases sont vérifiés, sans aucune
# attente liée au timing ni toucher dans le combat.
appId: com.bpotet.ascent
name: Combat d'essai du build de preview
tags:
  - story-31
  - story-32
  - story-81
  - story-90
---
- runFlow: ../subflows/launch-fresh.yaml

- tapOn: "Combat d'essai"

# H1 : le choix du héros, la Sentinelle sélectionnée par défaut.
- extendedWaitUntil:
    visible:
      id: 'hero-choice-start'
    timeout: 15000
- assertVisible:
    id: 'hero-choice-sentinel'
- assertVisible:
    id: 'hero-choice-wanderer'
- takeScreenshot: trial-battle-h1-hero-choice
- tapOn:
    id: 'hero-choice-start'

# Le combat : la scène 2.5D, la frise d'action et la barre du héros, visibles dans toutes les
# phases du combat.
- extendedWaitUntil:
    visible:
      id: 'battle-scene-frame'
    timeout: 15000
- assertVisible:
    id: 'battle-action-track'
- assertVisible:
    id: 'battle-hero-bar'
- takeScreenshot: trial-battle-f2-action-track
