# Story #31 : le combat d'essai, ouvert depuis son point d'entrée provisoire (build de preview).
# Parcours : installation neuve → « Combat d'essai » → bulle F2 fermée → le Spectre visé, puis
# « Attaquer » → bulle P9 fermée → « Attaquer » à chaque phase du héros jusqu'à la victoire →
# écran de fin, avec les panneaux Réglages d'essai et Mesures → transition et avancée allongées à
# 2 000 ms → « Rejouer » → bannière « Phase ennemie », avancée, préparation, sans aucun appui →
# bannière « À toi » → victoire → panneau Mesures.
# La partie se gagne toujours sans parer : 12 dégâts subis au plus par manche, 4 manches, 80 PV.
# Maestro ne teste pas le timing (il ne touche pas à 10 ms près, et chaque commande prend une
# seconde ou plus sur l'émulateur) : les écrans à état précis (P2 à P8) sont vérifiés par les tests
# d'intégration, avec l'horloge de combat manuelle. Les états brefs (P0, P0b, P1, F0) sont capturés
# au second combat, avec les durées allongées par les réglages d'essai, chacun attendu par un texte
# propre à cet état. Le parcours joue les sons du combat et vérifie, dans le panneau Mesures,
# qu'une latence du son a été mesurée.
# Sur l'émulateur sans animations, l'app réduit les animations : la bannière est `phase-banner-still`.
appId: com.bpotet.ascent
name: Combat d'essai du build de preview
tags:
  - story-31
---
- runFlow: ../subflows/launch-fresh.yaml

- tapOn: "Combat d'essai"
- extendedWaitUntil:
    visible:
      id: 'battle-hint-hero'
    timeout: 15000
- assertVisible: 'Phase du héros|PHASE DU HÉROS'
- takeScreenshot: trial-battle-f2-first-use
- tapOn:
    id: 'battle-hint-hero'
- assertNotVisible:
    id: 'battle-hint-hero'
- takeScreenshot: trial-battle-f1-hero-phase

# Le Spectre visé, puis « Attaquer » (validé au relâcher).
- tapOn:
    id: 'enemy-specter'
- assertVisible:
    id: 'battle-attack-button'
    text: 'Attaquer, cible : Spectre'
- tapOn:
    id: 'battle-attack-button'

# Première phase ennemie : la bulle passe avant la transition, qui commence à sa fermeture.
- extendedWaitUntil:
    visible:
      id: 'battle-hint-defense'
    timeout: 10000
- takeScreenshot: trial-battle-p9-first-use
- tapOn:
    id: 'battle-hint-defense'

# Trois autres attaques, sans parer : le Spectre (4 PV), puis la Goule deux fois.
- repeat:
    times: 3
    commands:
      - extendedWaitUntil:
          visible:
            id: 'battle-attack-button'
            enabled: true
          timeout: 30000
      - tapOn:
          id: 'battle-attack-button'
          enabled: true

- extendedWaitUntil:
    visible: 'Combat gagné'
    timeout: 20000
- assertVisible: 'La Goule et le Spectre sont tombés.'
- assertVisible: "Réglages d'essai"
- takeScreenshot: trial-battle-end

# Réglages d'essai : transition et avancée allongées à 2 000 ms, pour capturer les états brefs.
# Les réglages suivent la fin du combat, dans une vue qui défile. Sur 320 x 640, la partie qui
# défile est petite : de courts glissements évitent de passer la ligne visée.
- repeat:
    while:
      notVisible: 'Allonger la transition de phase'
    times: 12
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 68%
          duration: 600
- repeat:
    times: 24
    commands:
      - tapOn: 'Allonger la transition de phase'
- repeat:
    while:
      notVisible: "Allonger l'avancée"
    times: 12
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 68%
          duration: 600
- repeat:
    times: 32
    commands:
      - tapOn: "Allonger l'avancée"
# Les milliers sont séparés par une espace fine insécable : « 2 000 ms ».
- assertVisible:
    id: 'trial-tuning-stepInMs'
    text: '2.000 ms'
- takeScreenshot: trial-battle-tuning

- scrollUntilVisible:
    element:
      text: 'Rejouer'
    direction: UP
- tapOn: 'Rejouer'
- extendedWaitUntil:
    visible:
      id: 'battle-attack-button'
      text: 'Attaquer, cible : Goule'
    timeout: 10000
# Au combat suivant, la bulle d'aide n'apparaît plus.
- assertNotVisible:
    id: 'battle-hint-hero'
# Sans attendre que l'écran se stabilise : la transition commence 500 ms après le relâcher.
- tapOn:
    id: 'battle-attack-button'
    waitToSettleTimeoutMs: 200

# Les états brefs du second combat, chacun attendu par un texte qui n'existe que dans cet état,
# puis capturé aussitôt (durées allongées : transition et avancée de 2 000 ms chacune).
# P0 : bannière « Phase ennemie », pendant la transition.
- extendedWaitUntil:
    visible: 'Prépare ta parade'
    timeout: 5000
- takeScreenshot: trial-battle-p0-enemy-phase
# P0b : la Goule s'avance.
- extendedWaitUntil:
    visible: 'Goule s.avance'
    timeout: 5000
- takeScreenshot: trial-battle-p0b-step-in
# P1 : une préparation, celle du Spectre (plus longue que celle de la Goule).
- extendedWaitUntil:
    visible: 'Spectre : .*'
    timeout: 10000
- takeScreenshot: trial-battle-p1-wind-up
# F0 : bannière « À toi », pendant la transition vers la phase du héros.
- extendedWaitUntil:
    visible: 'Vise et attaque'
    timeout: 15000
- takeScreenshot: trial-battle-f0-to-hero

# Trois autres attaques jusqu'à la victoire.
- repeat:
    times: 3
    commands:
      - extendedWaitUntil:
          visible:
            id: 'battle-attack-button'
            enabled: true
          timeout: 30000
      - tapOn:
          id: 'battle-attack-button'
          enabled: true
- extendedWaitUntil:
    visible: 'Combat gagné'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'battle-measures-panel'
    direction: DOWN
# Les sons ont joué : sans aucun son, la ligne afficherait « aucune mesure ».
- scrollUntilVisible:
    element:
      text: 'Latence du son : médiane .*'
    direction: DOWN
- takeScreenshot: trial-battle-measures
