name: Build Android APK
description: >-
  Génère le projet Android (Continuous Native Generation) puis construit un APK release,
  signé avec la clé de debug : installable pour tester, pas publiable sur le Play Store.
inputs:
  apk-name:
    description: Nom du fichier APK produit
    required: true
  channel:
    description: 'Canal du build : preview ou production'
    required: false
    default: preview
outputs:
  apk-path:
    description: Chemin de l'APK construit
    value: ${{ steps.apk.outputs.path }}
runs:
  using: composite
  steps:
    # Avant prebuild et Gradle : c'est Gradle qui produit le bundle JS (Metro), où la variable
    # EXPO_PUBLIC_ASCENT_CHANNEL est inscrite. Un canal inconnu arrête le build.
    - name: Set the build channel
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
      run: |
        case "$CHANNEL" in
          preview | production) ;;
          *)
            echo "::error::Unknown build channel '$CHANNEL' (expected preview or production)"
            exit 1
            ;;
        esac
        echo "EXPO_PUBLIC_ASCENT_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
    - name: Generate the native Android project
      shell: bash
      run: npx expo prebuild --platform android --no-install
    - name: Assemble the release APK
      shell: bash
      working-directory: android
      run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
    - id: apk
      name: Rename the APK
      shell: bash
      run: |
        mkdir -p dist
        cp android/app/build/outputs/apk/release/app-release.apk "dist/${{ inputs.apk-name }}"
        echo "path=dist/${{ inputs.apk-name }}" >> "$GITHUB_OUTPUT"
    # Taille et permissions Android de l'APK, relevées dans le journal et le résumé du job.
    - name: Report the APK size and permissions
      shell: bash
      env:
        APK: dist/${{ inputs.apk-name }}
      run: |
        aapt="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -n 1)"
        {
          echo "### APK"
          echo "- Size: $(stat -c %s "$APK") bytes"
          echo "- Permissions:"
          if [ -n "$aapt" ]; then
            "$aapt" dump permissions "$APK" | sed -n "s/^uses-permission: name='\([^']*\)'.*/  - \1/p" | sort
          else
            echo "  - (aapt unavailable)"
          fi
        } | tee -a "$GITHUB_STEP_SUMMARY"
