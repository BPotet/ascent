# Barrières de qualité (docs/workflow.md, « Barrières de qualité » et « CI/CD et Git Flow »).
name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']
    # ready_for_review : la sortie de brouillon lance l'APK et le test de fumée, sautés en brouillon.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main, 'release/**', 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.28.0
  MAESTRO_VERSION: 2.11.0

jobs:
  # Un changement qui ne touche que la documentation ou la configuration des agents saute les
  # barrières lourdes (scripts/ci/code-changes.mjs). Les jobs qui en dépendent sont sautés avec elles.
  # Un changement qui ne touche pas l'app (sortie `app`) saute l'APK et le test de fumée.
  changes:
    name: Code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: diff
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/code-changes.mjs

  commits:
    name: Commits (commitlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check every commit of the pull request
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          from="$BASE_SHA"
          if [ "$BASE_REF" = "main" ]; then
            # A release or hotfix brings commits that develop already holds, each one
            # checked by its own pull request: only the commits added since are checked.
            from="$(git merge-base origin/develop "$HEAD_SHA")"
          fi
          npx commitlint --verbose --from "$from" --to "$HEAD_SHA"

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan the git history
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --verbose

  static:
    name: Style, types and architecture
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Style (Prettier)
        run: npm run format:check
      - name: Style (ESLint)
        run: npm run lint
      - name: Types (tsc --noEmit)
        run: npm run typecheck
      - name: Architecture (dependency-cruiser)
        run: npm run arch
      - name: CI scripts tests (node:test)
        run: npm run test:scripts

  tests:
    name: Unit, integration and BDD tests with coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Une seule exécution des trois projets Jest (unit, integration, bdd) avec les seuils de couverture.
      - name: Unit, integration and BDD tests with coverage thresholds
        run: npm run test:coverage -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    needs: tests
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip when SonarQube Cloud is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::warning title=SonarQube Cloud::SONAR_TOKEN secret is missing, analysis skipped (temporary gap, see docs/adr/0001-socle-technique.md)."
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage
          path: coverage
      - name: Analyse and wait for the quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5

  android-apk:
    name: Android APK
    # Sauté sur une PR en brouillon et quand le changement ne touche pas l'app ; un check sauté
    # compte comme réussi pour la protection de branche. Sur un push ou un lancement manuel, seule
    # la sortie `app` compte.
    needs: [changes, static, tests]
    if: needs.changes.outputs.app == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: build
        uses: ./.github/actions/build-android-apk
        with:
          apk-name: ascent-${{ github.sha }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ascent-android-apk
          path: ${{ steps.build.outputs.apk-path }}
          if-no-files-found: error
          # 1 jour sur une PR (le test de fumée le télécharge dans le même run), 7 jours sur develop,
          # 30 jours sur main, release/* et hotfix/*.
          retention-days: >-
            ${{ github.event_name == 'pull_request' && 1
              || ((github.ref_name == 'main' || startsWith(github.ref_name, 'release/')
                || startsWith(github.ref_name, 'hotfix/')) && 30 || 7) }}

  cleanup-artifacts:
    name: Clean up old artifacts
    # Libère le stockage GitHub Actions (scripts/ci/cleanup-artifacts.mjs). Pas sur une PR venant
    # d'un fork : son jeton ne peut pas supprimer d'artefact.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'push' && github.ref_name == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Delete the APKs nobody needs any more
        # Une suppression qui échoue n'est qu'un avertissement : ce job ne bloque jamais la CI.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/cleanup-artifacts.mjs

  # Décision du propriétaire du 3 novembre 2026 : l'end-to-end se réduit à un test de fumée, qui
  # vérifie que l'APK s'installe et que l'app démarre (e2e/flows/launch.yaml). Plus de parcours ni
  # de captures par story.
  e2e-android:
    name: End-to-end smoke test (Maestro, Android)
    # Mêmes conditions que l'APK, qu'il télécharge.
    needs: [changes, android-apk]
    if: needs.changes.outputs.app == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Écart temporaire (docs/adr/0001-socle-technique.md) : non bloquant tant que l'émulateur
    # n'a pas prouvé sa stabilité en CI.
    continue-on-error: true
    timeout-minutes: 30
    # Image système de l'émulateur, déclarée une seule fois pour le cache et pour l'émulateur.
    env:
      EMULATOR_API_LEVEL: 34
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ascent-android-apk
          path: dist
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        # L'installeur lit MAESTRO_VERSION ; la vérification échoue si la version n'est pas la bonne.
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          installed="$("$HOME/.maestro/bin/maestro" --version | tail -n 1)"
          echo "Maestro ${installed}"
          test "${installed}" = "${MAESTRO_VERSION}"
      - name: Cache the Android system image
        # Le téléchargement de l'image chez Google échoue parfois (archive corrompue) et l'émulateur
        # ne démarre pas. Une image déjà présente n'est pas retéléchargée par sdkmanager.
        # Le préfixe du SDK reste en dur : le contexte `env` ne voit pas ANDROID_HOME du runner.
        id: system-image-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ env.EMULATOR_API_LEVEL }}/${{ env.EMULATOR_TARGET }}/${{ env.EMULATOR_ARCH }}
          # Incrémenter le suffixe `-vN` force le renouvellement du cache.
          key: android-system-image-${{ env.EMULATOR_API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-v1
      - name: Preinstall the Android system image
        # Sans cache, l'image est installée ici avec trois tentatives. Une archive corrompue peut
        # laisser sdkmanager terminer sans erreur : seul `package.xml` prouve l'installation.
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        run: |
          set -uo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          package="system-images;android-${EMULATOR_API_LEVEL};${EMULATOR_TARGET};${EMULATOR_ARCH}"
          image_dir="${ANDROID_HOME}/system-images/android-${EMULATOR_API_LEVEL}/${EMULATOR_TARGET}/${EMULATOR_ARCH}"
          yes | "${sdkmanager}" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            echo "Installing ${package} (attempt ${attempt}/3)"
            if "${sdkmanager}" --install "${package}" && [ -f "${image_dir}/package.xml" ]; then
              echo "${package} installed in ${image_dir}"
              exit 0
            fi
            echo "::warning::Attempt ${attempt} to install ${package} failed."
            rm -rf "${image_dir}"
            [ "${attempt}" -lt 3 ] && sleep 30
          done
          echo "::error::${package} could not be installed after 3 attempts."
          exit 1
      - name: Install the APK and run the smoke test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: ${{ env.EMULATOR_ARCH }}
          target: ${{ env.EMULATOR_TARGET }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r dist/*.apk
            maestro test e2e/flows/launch.yaml --format junit --output reports/e2e/junit.xml --test-output-dir reports/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/e2e
          if-no-files-found: ignore
          retention-days: 7
